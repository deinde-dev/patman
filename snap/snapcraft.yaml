name: patman
title: Patman
summary: Create, check, send and track patch series sent by email
description: |
  Patman helps you create, send, track and review patch series for projects
  which take patches by email, such as U-Boot and the Linux kernel.

  It creates patches from your git branch, cleans them up by removing
  unwanted tags, adds a cover letter with change logs, runs them through
  checkpatch.pl and its own checks, and sends them to the right people with
  git send-email or through a web relay. Once a series is out for review, it
  tracks it on Patchwork, gathers review tags into your commits and keeps
  track of each version.

  'patman serve' shows your series and reviews on a mobile-friendly web
  page. Installed with pip, patman can also draft reviews of other people's
  patches using a Claude agent, which the snap leaves out.

  The snap is strictly confined, so it can only reach repositories in your
  home directory, and in /media and /mnt once removable-media is connected.
  It brings its own git, git send-email, perl and editor, so your git
  configuration must not rely on programs from the host, such as a sendmail
  program or a credential helper. See
  https://patman.readthedocs.io/en/latest/guide/snap.html for what this
  means.
license: GPL-2.0-or-later
website: https://deinde.dev/patman/
source-code: https://github.com/deinde-dev/patman
issues: https://github.com/deinde-dev/patman/issues
contact: https://github.com/deinde-dev/patman/issues
icon: logo/patman-icon.svg
adopt-info: patman
base: core24
grade: stable
confinement: strict

apps:
  patman:
    command: bin/patman
    command-chain:
      - bin/launcher
    plugs:
      - home
      - removable-media
      - network
      - network-bind
      - dot-patman
      - dot-gitconfig
plugs:
  dot-patman:
    interface: personal-files
    write:
      - $HOME/.patman
      - $HOME/.config/patman.d
  dot-gitconfig:
    interface: personal-files
    read:
      - $HOME/.gitconfig
      - $HOME/.config/git

parts:
  patman:
    plugin: python
    source: .
    # Install patman with Gmail support. The review agent needs Claude Code,
    # which is most of the size of the snap with it included, and which
    # updates more often than patman, so leave it out
    python-packages:
      - .[gmail]
    # The base snap has no Python, so ship the one which patman runs on
    stage-packages:
      - python3.12-minimal
      - libpython3.12-minimal
      - libpython3.12-stdlib
    override-pull: |
      craftctl default
      craftctl set version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
    override-build: |
      craftctl default
      site="$CRAFT_PART_INSTALL/lib/python3.12/site-packages"
      # Of the descriptions of 600 Google APIs which come with the client,
      # patman only uses Gmail's
      find "$site/googleapiclient/discovery_cache/documents" -type f \
        ! -name gmail.v1.json -delete
      # pip is only needed to build the snap
      rm -rf "$site"/pip "$site"/pip-*.dist-info

  # The snap cannot run programs from the host, so it brings git and git
  # send-email, perl for checkpatch.pl and get_maintainer.pl, and editors
  # for 'git send-email --annotate'
  tools:
    plugin: nil
    stage-packages:
      - git
      - git-email
      - perl
      - libauthen-sasl-perl
      - libio-socket-ssl-perl
      - libnet-ssleay-perl
      - libmailtools-perl
      - nano
      - vim-tiny
    override-prime: |
      craftctl default
      # git send-email is a perl script which names the host's perl
      sed -i '1s|^#!.*|#!/usr/bin/env perl|' \
        "$CRAFT_PRIME/usr/lib/git-core/git-send-email"
      # Debian sets up these names when it installs the packages, which a
      # snap does not do, and git falls back to 'editor'
      ln -sf vim.tiny "$CRAFT_PRIME/usr/bin/vi"
      ln -sf vim.tiny "$CRAFT_PRIME/usr/bin/vim"
      ln -sf nano "$CRAFT_PRIME/usr/bin/editor"

  launcher:
    plugin: dump
    source: snap/local
    organize:
      launcher: bin/launcher
